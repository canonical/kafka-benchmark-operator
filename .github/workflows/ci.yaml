name: Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  schedule:
    - cron: "53 0 * * *" # Daily at 00:53 UTC
  # Triggered on push to branch "main" by .github/workflows/release.yaml
  workflow_call:
    outputs:
      artifact-prefix:
        description: build_charm.yaml `artifact-prefix` output
        value: ${{ jobs.build.outputs.artifact-prefix }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install tox
        run: pipx install tox
      - name: Run linters
        run: tox run -e lint

  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install tox
        run: pipx install tox
      - name: Run tests
        run: tox run -e unit

  build:
    name: Build charms
    uses: canonical/data-platform-workflows/.github/workflows/build_charm.yaml@v26.0.0
    with:
      charmcraft-snap-channel: latest/beta/data-platform  # TODO: remove after charmcraft 3.3 stable release
      path-to-charm-directory: .
      cache: false  # TODO: change this to true once we are in charmcraftcache-hub

  integration-test:
    strategy:
      fail-fast: false
      matrix:
        group:
          - False-vm
          - True-vm
    name: Integration test charm - ${{ matrix.group }}"
    needs:
      - lint
      - unit-test
      - build
    runs-on: [self-hosted, linux, AMD64, X64, large, noble]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup operator environment
        run: |
          sudo snap install concierge --classic
          sudo concierge prepare --trace --extra-debs pipx
      - name: Install dependencies
        run: |
          pipx install tox
          pipx ensurepath
      - name: Download packed charm(s)
        uses: actions/download-artifact@v6
        with:
          pattern: ${{ needs.build.outputs.artifact-prefix }}-*
          merge-multiple: true
      - name: Run integration tests
        run: |
          juju switch concierge-lxd
          juju add-model ci
          tox run -e integration -- tests/integration/test_charm.py \
            --group='${{ matrix.group }}' \
            --model ci
        env:
          CI_PACKED_CHARMS: ${{ needs.build.outputs.charms }}

  integration-test-k8s-internal:
    name: Integration test charm
    needs:
      - lint
      - unit-test
      - build
    runs-on: [self-hosted, linux, AMD64, X64, large, noble]
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup operator environment
        run: |
          sudo snap install concierge --classic
          sudo concierge prepare --trace --extra-debs pipx
      - name: Install dependencies
        run: |
          pipx install tox
          pipx ensurepath
      - name: Download packed charm(s)
        uses: actions/download-artifact@v6
        with:
          pattern: ${{ needs.build.outputs.artifact-prefix }}-*
          merge-multiple: true
      - name: Run integration tests
        run: |
          juju switch concierge-k8s
          juju add-model ci
          tox run -e integration-k8s-internal -- --model ci
        env:
          CI_PACKED_CHARMS: ${{ needs.build.outputs.charms }}
